services:
  - type: web
    name: alvoflow
    runtime: docker
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: AlvoFlow
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: pt_PT
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      # Emails de recuperação de senha e de nome de utilizador: por omissão ficam em "log"
      # (não envia de verdade — grava em storage/logs/laravel.log). Troque MAIL_MAILER para
      # "smtp" e preencha os campos abaixo (ex: Brevo, Mailgun, SES) quando quiser que o
      # email chegue de verdade aos utilizadores.
      - key: MAIL_MAILER
        value: log
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
